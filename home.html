<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Stress Away</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }
        .center-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }
        .section {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 320px;
            text-align: center;
        }
        .controls {
            margin: 1rem 0;
        }
        select {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="center-wrapper">
        <div class="section" id="english-section">
            <h2>English Songs</h2>
            <audio id="audioPlayerEnglish" controls></audio>
            <div class="controls">
                <button onclick="prevSong('english')">Previous</button>
                <button onclick="togglePlayPause('english')">Play / Pause</button>
                <button onclick="nextSong('english')">Next</button>
            </div>
            <h3>Playlist</h3>
            <select id="playlistEnglish" size="5" onchange="playSong('english', this.selectedIndex)">
                <option>Shape of You</option>
                <option>Blinding Lights</option>
                <option>Perfect</option>
            </select>
        </div>
        <div class="section" id="hindi-section">
            <h2>Hindi Songs</h2>
            <audio id="audioPlayerHindi" controls></audio>
            <div class="controls">
                <button onclick="prevSong('hindi')">Previous</button>
                <button onclick="togglePlayPause('hindi')">Play / Pause</button>
                <button onclick="nextSong('hindi')">Next</button>
            </div>
            <h3>Playlist</h3>
            <select id="playlistHindi" size="5" onchange="playSong('hindi', this.selectedIndex)">
                <option>Tum Hi Ho</option>
                <option>Kal Ho Naa Ho</option>
                <option>Channa Mereya</option>
            </select>
        </div>
        <div class="section" id="telugu-section">
            <h2>Telugu Songs</h2>
            <audio id="audioPlayerTelugu" controls></audio>
            <div class="controls">
                <button onclick="prevSong('telugu')">Previous</button>
                <button onclick="togglePlayPause('telugu')">Play / Pause</button>
                <button onclick="nextSong('telugu')">Next</button>
            </div>
            <h3>Playlist</h3>
            <select id="playlistTelugu" size="5" onchange="playSong('telugu', this.selectedIndex)">
                <option>Butta Bomma</option>
                <option>Samajavaragamana</option>
                <option>Vachindamma</option>
            </select>
        </div>
        <a href="/home.html">Home</a>
    </div>
    <script src="./script.js"></script>
</body>
</html>
